[package]
name = "arcrelay-core"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[features]
default = []
test-support = ["dep:sea-orm", "dep:sea-orm-migration", "dep:xxhash-rust"]
native = [
    "dep:arcrelay-content",
    "dep:clipboard-rs",
    "dep:ocr-rs",
    "dep:image",
    "dep:ammonia",
    "dep:hostname",
    "dep:png",
    "dep:xxhash-rust",
    "dep:sea-orm",
    "dep:sea-orm-migration",
    "dep:libc",
    "dep:sysinfo",
    "dep:windows",
    "dep:windows-core",
    "dep:core-graphics",
    "dep:core-foundation",
    "dep:dispatch",
    "dep:block2",
    "dep:objc2",
    "dep:objc2-app-kit",
    "dep:objc2-foundation",
]

[[bin]]
name = "debug_cli"
path = "src/bin/debug_cli.rs"
required-features = ["native"]

[dependencies]
arcrelay-content = { optional = true, version = "0.1.0", git = "https://github.com/ArcRelayProject/arcrelay-content.git", rev = "a4b00f20f1e03c2905abe9bae36c601fb7683e1c" }
arcrelay-input = { version = "0.1.0", git = "https://github.com/ArcRelayProject/arcrelay-input.git", rev = "e15d533c462d8a0301c1954102246d3b36b56cea" }
ts-rs = { version = "12", features = ["serde-json-impl", "chrono-impl", "uuid-impl", "no-serde-warnings"] }
regex = "1"
unicode-segmentation = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
async-trait = "0.1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = { version = "0.2", optional = true }
clipboard-rs = { version = "0.3.5", optional = true }
ocr-rs = { optional = true, git = "https://github.com/zibo-chen/rust-paddle-ocr", rev = "f838a085c39beb722a315727ec13a90eed496f2c" }
image = { optional = true, version = "0.25", default-features = false, features = ["png"] }
ammonia = { version = "4", optional = true }
hostname = { version = "0.4", optional = true }
png = { version = "0.17", optional = true }
xxhash-rust = { optional = true, version = "0.8", features = ["xxh3"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
sea-orm = { optional = true, version = "1.1.20", default-features = false, features = [
    "macros",
    "runtime-tokio-rustls",
    "sqlx-sqlite",
] }
sea-orm-migration = { optional = true, version = "1.1.20", default-features = false, features = [
    "runtime-tokio-rustls",
    "sqlx-sqlite",
] }

[target.'cfg(target_os = "macos")'.dependencies]
sysinfo = { version = "0.33", optional = true }
core-graphics = { version = "0.24", optional = true }
core-foundation = { version = "0.10", optional = true }
dispatch = { version = "0.2", optional = true }
block2 = { version = "0.6", optional = true }
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { optional = true, version = "0.3", features = ["NSRunningApplication", "NSWorkspace", "NSPasteboard", "NSPasteboardItem", "block2"] }
objc2-foundation = { optional = true, version = "0.3", features = ["NSArray", "NSData", "NSURL", "NSDistributedNotificationCenter", "NSNotification", "NSOperation", "NSObject", "NSString", "block2"] }

[target.'cfg(target_os = "windows")'.dependencies]
sysinfo = { version = "0.33", optional = true }
windows = { optional = true, version = "0.58", features = [
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_WinRT",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Pointer",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_Media",
    "Media_Control",
    "Foundation",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_System_Threading",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Storage_FileSystem",
] }
windows-core = { version = "0.58", optional = true }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
